[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-agent"
version = "0.1.0"
description = "A modular, multimodal AI agent designed to run in Termux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TermuxAgent contributors" }]
dependencies = []

[project.scripts]
termux-agent = "termuxagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
